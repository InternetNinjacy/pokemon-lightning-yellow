name: BTL-005 Batch A focused staging checks
on:
  push:
    branches:
      - feature/btl005-batch-a-mechanics-20261110
  workflow_dispatch:
jobs:
  batch-a-host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and strict Batch A approved data checks
        run: |
          python3 -m py_compile tests/run_btl_batch_a_staging_tests.py
          python3 tests/run_btl_batch_a_staging_tests.py

  batch-a-native-mgba:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install compiler and native mGBA libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends build-essential binutils-arm-none-eabi git libpng-dev python3 libmgba-dev
      - name: Prepare exact compiler inputs and build ROM
        run: |
          scripts/prepare-baseline.sh
          make -j2
      - name: Run exact-head native Batch A Singles/Doubles
        timeout-minutes: 20
        run: LIGHTNING_BATCH_A_ONLY=1 python3 tests/emulator/run.py
      - name: Diagnose exact-head native Blaine party without weakening checks
        timeout-minutes: 15
        run: LIGHTNING_BLAINE_ONLY=1 python3 tests/emulator/run.py
