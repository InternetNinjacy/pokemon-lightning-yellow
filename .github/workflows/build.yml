name: Battle split validation
on:
  push:
    branches: [main, 'feature/**', 'setup/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [modified, upstream-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install upstream Linux dependencies and test runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi git libpng-dev python3
          gcc --version
          arm-none-eabi-as --version
          dpkg-query -W build-essential binutils-arm-none-eabi git libpng-dev python3
      - name: Reject tracked ROMs
        run: |
          if git ls-files | grep -Ei '\.(gba|gbc|gb|nds|zip|7z)$'; then
            echo 'ROMs and ROM archives must not be committed.' >&2
            exit 1
          fi
      - name: Run production-routine regression tests and data/UI audits
        if: matrix.target == 'modified'
        run: |
          python3 tests/run_split_tests.py
          python3 tests/run_move_foundation_tests.py
          python3 tests/run_move_ui_tests.py
          python3 tests/run_original_move_data_tests.py
          python3 tests/run_move_pp_tests.py
          python3 tests/run_rtc_tests.py
          python3 tests/run_evolution_tests.py
          python3 tests/run_ponyta_tests.py
          python3 tests/run_pokedex_tests.py
          python3 tests/run_typing_tests.py
          python3 tests/run_wild_double_tests.py
          python3 tests/run_daycare_tests.py
          python3 tests/run_world_reward_tests.py
          python3 tests/run_vendor_tests.py
          python3 tests/run_capture_tests.py
          python3 tests/run_blaine_tests.py
          python3 tests/run_ranger_tests.py
          python3 tests/run_weather_tests.py
          python3 tests/run_gym_castform_tests.py
          python3 tests/run_rival_tests.py
          python3 tests/run_follower_asset_validator_tests.py
          python3 tests/run_follower_graphics_resource_tests.py
          python3 tests/run_follower_state_tests.py
          python3 scripts/check-integration-registrations.py
          python3 scripts/check-move-reconciliation.py
          python3 scripts/check-pewter-museum-trivia.py
      - name: Check out independent unchanged upstream baseline
        if: matrix.target == 'upstream-baseline'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: vanilla
          persist-credentials: false
      - name: Prepare pinned compiler and inputs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = upstream-baseline ]; then cd vanilla; fi
          "$GITHUB_WORKSPACE/scripts/prepare-baseline.sh"
      # No external artwork is committed. This one branch tests owner-reported
      # noncommercial permission using pinned source sheets in runner only.
      # Individual contributor grants and external redistribution are NOT certified.
      - name: Generate temporary exact-252 follower artwork for native ROM tests
        if: matrix.target == 'modified' && github.ref == 'refs/heads/feature/selectable-following-pokemon'
        timeout-minutes: 18
        run: |
          python3 scripts/build-follower-assets.py --confirmed-scope --report /tmp/wrl010-art-provenance.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/wrl010-art-provenance.json'))
          assert p['graphics_records']==255 and p['base_species_count']==252 and p['castform_form_count']==3
          print('PASS: ephemeral 252 base + 3 Castform graphics records generated; no ROM/artifact upload')
          PY
      - name: Build modified game and verify clean reproducibility
        if: matrix.target == 'modified'
        run: |
          make -j2
          sha256sum pokefirered.gba > /tmp/modified.sha256
          make clean
          make -j2
          sha256sum -c /tmp/modified.sha256
          # Remove generated third-party pixel bytes before source-tree audit.
          if [ "$GITHUB_REF" = 'refs/heads/feature/selectable-following-pokemon' ]; then
            git restore -- src/follower_assets_generated.inc
          fi
          git diff --exit-code
      - name: Install headless mGBA core
        if: matrix.target == 'modified'
        run: |
          sudo apt-get install -y --no-install-recommends libmgba-dev
          dpkg-query -W libmgba-dev
      - name: Execute ROM integration tests in mGBA
        if: matrix.target == 'modified'
        timeout-minutes: 20
        run: python3 tests/emulator/run.py
      - name: Verify original upstream SHA-1 twice from clean
        if: matrix.target == 'upstream-baseline'
        working-directory: vanilla
        run: |
          make -j2 compare
          make clean
          make -j2 compare
          sha1sum -c firered.sha1
          git diff --exit-code
      # Deliberately no artifact upload: ROMs remain ephemeral runner outputs.
