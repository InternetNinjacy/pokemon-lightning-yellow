name: Battle split validation
on:
  push:
    branches: [main, 'feature/**', 'setup/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [modified, upstream-baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Verify strict prechange source preservation against pinned gameplay main
      - name: Install upstream Linux dependencies and test runner
        run: |
          # Fetch all required packages before either expensive build. Bound
          # mirror/lock stalls; no compile/native/assertion gate is skipped.
          lightning_apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          lightning_packages=(build-essential binutils-arm-none-eabi git libpng-dev python3)
          if [ "${{ matrix.target }}" = modified ]; then
            lightning_packages+=(libmgba-dev)
          fi
          sudo apt-get "${lightning_apt_options[@]}" update
          sudo apt-get "${lightning_apt_options[@]}" install -y --no-install-recommends "${lightning_packages[@]}"
          gcc --version
          arm-none-eabi-as --version
          dpkg-query -W build-essential binutils-arm-none-eabi git libpng-dev python3
      - name: Reject tracked ROMs
        run: |
          if git ls-files | grep -Ei '\.(gba|gbc|gb|nds|zip|7z)$'; then
            echo 'ROMs and ROM archives must not be committed.' >&2
            exit 1
          fi
      - name: Run production-routine regression tests and data/UI audits
        if: matrix.target == 'modified'
        run: |
          python3 tests/run_split_tests.py
          python3 tests/run_move_catalog_tests.py
          python3 tests/run_new_fire_moves_tests.py
          python3 tests/run_new_ghost_moves_tests.py
          python3 tests/run_skitter_slash_tests.py
          python3 tests/run_venom_web_tests.py
          python3 tests/run_bug_statdrop_tests.py
          python3 tests/run_chirp_tests.py
          python3 tests/run_swarm_cloud_tests.py
          python3 tests/run_bellow_rock_tests.py
          python3 tests/run_scorching_sands_tests.py
          python3 tests/run_earth_power_tests.py
          python3 tests/run_move_foundation_tests.py
          python3 tests/run_move_ui_tests.py
          python3 tests/run_original_move_data_tests.py
          python3 tests/run_move_pp_tests.py
          python3 tests/run_roar_tests.py

          python3 tests/run_title_screen_tests.py

          python3 tests/run_approved_gift_tests.py
          python3 tests/run_pikachu_opening_tests.py

          python3 tests/run_elite_four_tests.py

          python3 tests/run_weather_move_tests.py
          python3 tests/run_weather_ability_tests.py
          python3 tests/run_weather_species_tests.py
          python3 tests/run_brock_weather_tests.py
          python3 tests/run_special_glalie_tests.py
          python3 tests/run_special_corphish_tests.py
          python3 tests/run_sow_event_tests.py
          python3 tests/run_original_effect_tests.py
          python3 tests/run_rtc_tests.py
          python3 tests/run_evolution_tests.py
          python3 tests/run_ponyta_tests.py
          python3 tests/run_pokedex_tests.py
          python3 tests/run_typing_tests.py
          python3 tests/run_wild_double_tests.py
          python3 tests/check_route1_encounters.py
          python3 tests/check_route2_encounters.py
          python3 tests/check_route22_encounters.py
          python3 tests/check_route23_encounters.py
          python3 tests/check_route5_encounters.py
          python3 tests/check_route8_drowzee.py
          python3 tests/check_victory_road_encounters.py
          python3 tests/check_route3_encounters.py
          python3 tests/check_viridian_forest_encounters.py
          python3 tests/check_mt_moon_encounters.py
          python3 tests/check_bulk_approved_grass.py
          python3 tests/check_bulk_kanto_central_grass.py
          python3 tests/check_bulk_kanto_interiors.py
          python3 tests/check_safari_zone_land.py
          python3 tests/check_kanto_water_bulk.py
          python3 tests/check_kanto_water_followup.py
          python3 tests/check_bulk_sevii_land.py
          python3 tests/check_bulk_sevii_water.py
          python3 tests/check_bulk_sevii_water_second.py
          python3 tests/run_daycare_tests.py
          python3 tests/run_world_reward_tests.py
          python3 tests/run_vendor_tests.py
          python3 tests/run_capture_tests.py
          python3 tests/run_blaine_tests.py
          python3 tests/run_ranger_tests.py
          python3 tests/run_ordinary_trainer_tests.py
          python3 tests/run_weather_tests.py
          python3 tests/run_special_weather_tests.py
          python3 tests/run_gym_castform_tests.py
          python3 tests/run_rival_tests.py
          python3 tests/run_follower_state_tests.py
          python3 tests/run_follower_graphics_resource_tests.py
          python3 tests/run_follower_asset_validator_tests.py
          python3 tests/run_rocket_hideout_roster_tests.py
          python3 tests/run_rocket_hideout_quest_tests.py
          python3 scripts/check-integration-registrations.py
          python3 scripts/check-move-reconciliation.py
          python3 scripts/check-pewter-museum-trivia.py
      - name: Check out independent unchanged upstream baseline
        if: matrix.target == 'upstream-baseline'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pret/pokefirered
          ref: ce6406d8c2eaf46d543c8a2606de0c3cb1951982
          path: vanilla
          persist-credentials: false
      - name: Prepare pinned compiler and inputs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = upstream-baseline ]; then cd vanilla; fi
          "$GITHUB_WORKSPACE/scripts/prepare-baseline.sh"
      # No external artwork is committed. This one branch tests owner-reported
      # noncommercial permission using pinned source sheets in runner only.
      # Individual contributor grants and external redistribution are NOT certified.
      - name: Generate temporary exact-252 follower artwork for native ROM tests
        if: matrix.target == 'modified' && (github.head_ref == 'feature/selectable-following-pokemon' || github.ref == 'refs/heads/feature/selectable-following-pokemon')
        timeout-minutes: 18
        run: |
          python3 scripts/build-follower-assets.py --confirmed-scope --report /tmp/wrl010-art-provenance.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/wrl010-art-provenance.json'))
          assert p['graphics_records']==255 and p['base_species_count']==252 and p['castform_form_count']==3
          print('PASS: ephemeral 252 base + 3 Castform graphics records generated; no ROM/artifact upload')
          PY
      - name: Build modified game and verify clean reproducibility
        if: matrix.target == 'modified'
        run: |
          make -j2
          sha256sum pokefirered.gba > /tmp/modified.sha256
          make clean
          make -j2
          sha256sum -c /tmp/modified.sha256
          if [ "$GITHUB_REF" = 'refs/heads/feature/selectable-following-pokemon' ] || [ "$GITHUB_HEAD_REF" = 'feature/selectable-following-pokemon' ]; then
            git restore -- src/follower_assets_generated.inc
          fi
          git diff --exit-code
      - name: Install headless mGBA core
        if: matrix.target == 'modified'
        run: |
          # Already installed with the initial dependencies; verify it remains
          # available without starting another late network/package transaction.
          dpkg-query -W libmgba-dev
      - name: WRL-010 focused native all-species follower and opening-gift acceptance
        if: matrix.target == 'modified' && (github.head_ref == 'feature/selectable-following-pokemon' || github.ref == 'refs/heads/feature/selectable-following-pokemon')
        timeout-minutes: 12
        env:
          FOLLOWER_NATIVE_ALL252: '1'
          LIGHTNING_FOLLOWER_ONLY: '1'
        run: python3 tests/emulator/run.py
      - name: Focused Earth Power native battle tests in mGBA
        if: matrix.target == 'modified'
        timeout-minutes: 10
        run: LIGHTNING_EARTH_POWER_ONLY=1 python3 tests/emulator/run.py
      - name: Focused Scorching Sands native battle tests in mGBA
        if: matrix.target == 'modified'
        timeout-minutes: 10
        run: LIGHTNING_SCORCHING_SANDS_ONLY=1 python3 tests/emulator/run.py
      - name: Focused native Swarm Cloud regression in mGBA
        if: matrix.target == 'modified'
        timeout-minutes: 10
        run: |
          LIGHTNING_SWARM_ONLY=1 python3 tests/emulator/run.py
      - name: Focused owner-approved SOW actual native producers and all three walkable map events
        if: matrix.target == 'modified'
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/sow-captures"
          LIGHTNING_SOW_CAPTURE_DIR="$RUNNER_TEMP/sow-captures" LIGHTNING_SOW_PRODUCERS_ONLY=1 python3 tests/emulator/run.py
      - name: Upload real SOW emulator framebuffer evidence (PPM only, no ROM)
        if: matrix.target == 'modified' && always()
        uses: actions/upload-artifact@v4
        with:
          name: sow-overworld-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/sow-captures/*.ppm
          if-no-files-found: warn
          retention-days: 14
      - name: Execute ROM integration tests in mGBA
        if: matrix.target == 'modified'
        timeout-minutes: 30
        env:
          # An all-green run must not silently accept the zero-artwork stub.
          FOLLOWER_NATIVE_ALL252: ${{ (github.head_ref == 'feature/selectable-following-pokemon' || github.ref == 'refs/heads/feature/selectable-following-pokemon') && '1' || '0' }}
        run: python3 tests/emulator/run.py
      - name: Verify original upstream SHA-1 twice from clean
        if: matrix.target == 'upstream-baseline'
        working-directory: vanilla
        run: |
          make -j2 compare
          make clean
          make -j2 compare
          sha1sum -c firered.sha1
          git diff --exit-code
      # Deliberately no artifact upload: ROMs remain ephemeral runner outputs.
