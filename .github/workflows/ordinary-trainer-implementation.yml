name: Ordinary Trainer implementation preflight
on:
  push:
    branches: [feature/ordinary-trainers-full-implementation-20261106]
  pull_request:
    paths:
      - 'src/data/trainers.h'
      - 'src/data/trainer_parties.h'
      - 'data/scripts/trainers.inc'
      - 'data/maps/Route24/**'
      - 'data/maps/SixIsland_PatternBush/**'
      - 'docs/ordinary-trainers-implementation-lock.json'
      - 'tests/run_ordinary_trainer_tests.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python syntax
        run: python3 -m py_compile tests/run_ordinary_trainer_tests.py
      - name: Reconcile 510 Trainer design records with committed source
        run: python3 tests/run_ordinary_trainer_tests.py
      - name: Historical source preservation checks (no bypass)
        run: |
          python3 tests/run_elite_four_tests.py
          python3 tests/run_rival_tests.py
          python3 tests/run_pokedex_tests.py
