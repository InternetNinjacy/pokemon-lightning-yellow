name: Ordinary Trainer source wiring audit
on:
  push:
    branches:
      - docs/delegated-ordinary-trainer-completion-20261106
  pull_request:
    paths:
      - 'implementation/audit_ordinary_trainer_wiring.py'
      - 'implementation/ordinary-trainers-delegated-audit-draft.md'
      - 'implementation/ordinary-trainer-rematch-candidates.md'
      - 'data/maps/**'
      - 'data/scripts/**'
      - 'src/data/trainers.h'
      - 'src/data/trainer_parties.h'
      - 'src/vs_seeker.c'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Read-only ordinary Trainer source check against pinned main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout pinned gameplay main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4526a137573c722d1f685ac42a8057fc9b36497a
          path: gameplay
          persist-credentials: false
      - name: Checkout audit code and delegated draft from this PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: audit
          persist-credentials: false
      - name: Overlay audit-only text files without replacing gameplay source
        run: |
          mkdir -p gameplay/implementation
          cp audit/implementation/audit_ordinary_trainer_wiring.py gameplay/implementation/
          cp audit/implementation/ordinary-trainers-delegated-audit-draft.md gameplay/implementation/
          cp audit/implementation/ordinary-trainer-rematch-candidates.md gameplay/implementation/
          git -C gameplay rev-parse HEAD
          git -C audit rev-parse HEAD
      - name: Compile Python audit script for syntax validation
        working-directory: gameplay
        run: python3 -m py_compile implementation/audit_ordinary_trainer_wiring.py
      - name: Run complete read-only main-source audit
        working-directory: gameplay
        run: |
          python3 implementation/audit_ordinary_trainer_wiring.py --json | tee ordinary-trainer-wiring-audit.json
          python3 -m json.tool ordinary-trainer-wiring-audit.json >/dev/null
      - name: Upload JSON report only (no ROM binaries)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordinary-trainer-wiring-audit
          path: gameplay/ordinary-trainer-wiring-audit.json
          retention-days: 14
