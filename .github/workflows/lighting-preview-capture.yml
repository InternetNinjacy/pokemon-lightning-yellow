name: TIM-003 owner-approved lighting mGBA capture

on:
  push:
    branches: [feature/tim-003-lighting-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighting-framebuffer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native ARM and real mGBA screenshot dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential binutils-arm-none-eabi git libpng-dev libmgba-dev python3 python3-pil
      - name: Confirm production lighting is enabled with fixed approved values
        run: |
          grep '^#define LIGHTING_PREVIEW$' include/lighting_preview_config.h
          ! grep -q 'LIGHTING_PREVIEW_VARIANT' include/lighting_preview_config.h
          echo "Production source commit: $(git rev-parse HEAD)"
      - name: Compile actual Lightning Yellow ROM (never upload ROM)
        run: |
          ./scripts/prepare-baseline.sh
          make -j2
      - name: Capture genuine stationary field frames in mGBA
        timeout-minutes: 12
        env:
          LIGHTNING_LIGHTING_CAPTURE_DIR: /tmp/lightning-lighting
        run: |
          mkdir -p /tmp/lightning-lighting
          python3 tests/emulator/run.py 2>&1 | tee /tmp/lightning-lighting/emulator-run.log
          test "$(find /tmp/lightning-lighting -name '*.ppm' | wc -l)" -eq 24
      - name: Encode real frame pixels into PNG, manifest and contact sheet
        env:
          VARIANT: B
        run: |
          python3 tests/emulator/build_lighting_review.py /tmp/lightning-lighting --variant B --commit "$(git rev-parse HEAD)" --sheet
          python3 tests/emulator/validate_lighting_evidence.py /tmp/lightning-lighting/manifest.json
          test "$(find /tmp/lightning-lighting -name '*.png' | wc -l)" -eq 25
          printf 'Owner-approved source palette: %s\nBuilt from source commit: %s\nMansion reduced fog enabled on four floors; screenshot and native test evidence only.\n' "$VARIANT" "$(git rev-parse HEAD)" >/tmp/lightning-lighting/BUILD_DETAILS.txt
      - name: Upload only screenshot evidence (never ROM, ELF, saves or gameplay assets)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tim-003-production-mgba-lighting-approved
          path: |
            /tmp/lightning-lighting/*.png
            /tmp/lightning-lighting/manifest.json
            /tmp/lightning-lighting/BUILD_DETAILS.txt
            /tmp/lightning-lighting/emulator-run.log
          retention-days: 14
          if-no-files-found: error
