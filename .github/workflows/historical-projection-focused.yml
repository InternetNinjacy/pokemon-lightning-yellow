name: Historical projection exact-source focused guard
on:
  push:
    branches: ['validation/strict-tyron-amanda-projection-20261114']
  pull_request:
    paths:
      - 'tests/approved_ordinary_trainer_projection.py'
      - 'tests/approved_six_species_profile_projection.py'
      - 'tests/run_elite_four_tests.py'
      - 'tests/run_weather_ability_tests.py'
      - 'tests/run_weather_species_tests.py'
      - 'tests/run_typing_tests.py'
      - 'tests/run_brock_weather_tests.py'
      - 'tests/run_special_glalie_tests.py'
      - 'tests/approved_two_leader_party_projection.py'
      - '.github/workflows/historical-projection-focused.yml'
permissions:
  contents: read
jobs:
  source_integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Run every unchanged modified source/data audit before any build
        run: |
          python3 tests/run_split_tests.py
          python3 tests/run_move_catalog_tests.py
          python3 tests/run_new_fire_moves_tests.py
          python3 tests/run_new_ghost_moves_tests.py
