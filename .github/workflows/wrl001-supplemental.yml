# Review-only proposal. No automatic event; do not merge/dispatch without review.
name: WRL-001 supplemental exact-commit evidence
run-name: WRL-001 source 0f693dd7 / workflow ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Reviewed source SHA (only 0f693dd7bef4219e161b299f08a9a225ecdac9d6 is allowed)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wrl001-supplemental-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  supplemental-wrl001:
    name: supplemental-wrl001-only
    if: github.event_name == 'workflow_dispatch' && github.repository == 'InternetNinjacy/pokemon-lightning-yellow'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      WRL001_SOURCE_SHA: 0f693dd7bef4219e161b299f08a9a225ecdac9d6
      WRL001_MGBA_SHA: 26b7884bc25a5933960f3cdcd98bac1ae14d42e2
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Reject any unreviewed source request
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$REQUESTED_SOURCE_SHA" = "$WRL001_SOURCE_SHA"
          echo "SUPPLEMENTAL_WORKFLOW_SHA=$GITHUB_SHA"
          echo "SUPPLEMENTAL_SOURCE_SHA=$WRL001_SOURCE_SHA"

      - name: Check out the workflow controller at its immutable event SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false

      - name: Check out only the reviewed WRL-001 source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0f693dd7bef4219e161b299f08a9a225ecdac9d6
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed before installing or building anything
        run: |
          test "$(git -C controller rev-parse HEAD)" = "$GITHUB_SHA"
          python3 controller/scripts/wrl001_ci_guard.py --source source --phase preflight

      - name: Install the established compiler prerequisites and headless mGBA build tools
        run: |
          lightning_apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          sudo apt-get "${lightning_apt_options[@]}" update
          sudo apt-get "${lightning_apt_options[@]}" install -y --no-install-recommends build-essential binutils-arm-none-eabi git libpng-dev python3 cmake zlib1g-dev
          gcc --version
          arm-none-eabi-as --version
          dpkg-query -W build-essential binutils-arm-none-eabi git libpng-dev python3 cmake zlib1g-dev

      - name: Check out the approved mGBA 0.10.5 release by commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mgba-emu/mgba
          ref: 26b7884bc25a5933960f3cdcd98bac1ae14d42e2
          path: mgba-dependency
          persist-credentials: false

      - name: Build only the pinned headless mGBA library
        run: |
          test "$(git -C mgba-dependency rev-parse HEAD)" = "$WRL001_MGBA_SHA"
          echo "SUPPLEMENTAL_MGBA_SHA=$WRL001_MGBA_SHA"
          cmake -S mgba-dependency -B "$RUNNER_TEMP/wrl001-mgba-build" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/wrl001-mgba/usr" \
            -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu \
            -DCMAKE_BUILD_TYPE=Release -DLIBMGBA_ONLY=ON \
            -DBUILD_SHARED=ON -DBUILD_STATIC=OFF \
            -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_TEST=OFF \
            -DBUILD_SUITE=OFF -DBUILD_CINEMA=OFF -DBUILD_ROM_TEST=OFF \
            -DBUILD_PYTHON=OFF -DBUILD_EXAMPLE=OFF -DBUILD_PERF=OFF \
            -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF \
            -DUSE_FFMPEG=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF \
            -DUSE_SQLITE3=OFF -DUSE_ELF=OFF -DUSE_LUA=OFF \
            -DUSE_LZMA=OFF -DUSE_DISCORD_RPC=OFF -DUSE_EDITLINE=OFF
          cmake --build "$RUNNER_TEMP/wrl001-mgba-build" --parallel 2
          cmake --install "$RUNNER_TEMP/wrl001-mgba-build"

      - name: Run only the focused WRL-001 source contract
        working-directory: source
        run: python3 tests/run_pikachu_opening_tests.py

      - name: Prepare the unchanged pinned agbcc inputs and build once
        working-directory: source
        run: |
          scripts/prepare-baseline.sh
          make -j2

      - name: Execute only LIGHTNING_WRL001_ONLY with no selector fallback
        timeout-minutes: 15
        run: |
          python3 controller/scripts/wrl001_ci_guard.py --source source --phase native \
            --mgba-prefix "$RUNNER_TEMP/wrl001-mgba"

      - name: Record the supplemental boundary in the run summary
        run: |
          {
            echo 'WRL-001 supplemental evidence only; no required CI replacement.'
            echo "Source: $WRL001_SOURCE_SHA"
            echo "Workflow: $GITHUB_SHA"
            echo "mGBA 0.10.5: $WRL001_MGBA_SHA"
            echo 'Required modified/upstream gates remain separately unresolved.'
          } >> "$GITHUB_STEP_SUMMARY"
      # No uploads, caches, releases, dispatches, repository writes or ROM/BIOS/saves.
