name: Center Reminder approved learnset native fixture
on:
  push:
    branches: ['validation/center-reminder-current-eevee-learnsets-20261114']
  pull_request:
    paths:
      - 'tests/emulator/center_move_reminder_learning.c'
      - '.github/workflows/center-reminder-learnset-fixture.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Check exact head and approved current Vaporeon move data
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          s=Path("src/data/pokemon/level_up_learnsets.h").read_text()
          v=s.split("sVaporeonLevelUpLearnset[] = {",1)[1].split("\n};",1)[0]
          assert "LEVEL_UP_MOVE(1, MOVE_BUBBLE)" in v
          assert "LEVEL_UP_MOVE(8, MOVE_WATER_GUN)" in v
          t=Path("tests/emulator/center_move_reminder_learning.c").read_text()
          assert "SPECIES_VAPOREON, 7" in t and "SPECIES_VAPOREON, 8" in t
          assert "SYM_Task_HandleChooseMonInput" in t
          assert "flashRoundTrip()" in t and "SYM_CB2_MoveRelearner" in t
          print("PASS current source with strict original native UI/save assertions preserved")
          PY
      - name: Install GBA native compiler and mGBA
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi libpng-dev python3 libmgba-dev
      - name: Build real ROM
        run: |
          scripts/prepare-baseline.sh
          make -j2
      - name: Run actual native relearn eligibility and full physical UI flows
        timeout-minutes: 15
        run: LIGHTNING_CENTER_REMINDER_LEARNING_ONLY=1 python3 tests/emulator/run.py
