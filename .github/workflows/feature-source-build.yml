name: Feature source build
on:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'data/**'
      - '.github/workflows/feature-source-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install source toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi git libpng-dev
      - name: Reject tracked ROMs
        run: |
          if git ls-files | grep -Ei '\.(gba|gbc|gb|nds|zip|7z)$'; then
            echo 'ROMs and ROM archives must not be committed.' >&2
            exit 1
          fi
      - name: Prepare pinned upstream build tools
        run: scripts/prepare-baseline.sh
      - name: Validate museum placement and trivia state machine
        run: python3 scripts/check-pewter-museum-trivia.py
      - name: Compile modified FireRed source (not vanilla SHA comparison)
        run: make -j2 firered
      - name: Verify no tracked files changed
        run: git diff --exit-code
      # No ROM artifacts are uploaded or distributed.
