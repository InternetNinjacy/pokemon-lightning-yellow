name: Lightning Yellow title-screen capture

on:
  push:
    branches: [feature/lightning-yellow-title-screen]
  pull_request:
    paths:
      - 'graphics/title_screen/lightning_yellow/**'
      - 'src/title_screen.c'
      - 'src/graphics.c'
      - 'tests/run_title_screen_tests.py'
      - 'tests/emulator/runner.c'
      - 'tests/emulator/ppm_to_png.py'
      - '.github/workflows/title-screen-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  title-framebuffer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install tools and real mGBA headless emulator
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends build-essential binutils-arm-none-eabi git libpng-dev libmgba-dev python3
      - name: Validate title source and indexed assets
        run: python3 tests/run_title_screen_tests.py
      - name: Compile actual Lightning Yellow ROM
        run: |
          ./scripts/prepare-baseline.sh
          make -j2
      - name: Capture genuine mGBA title and START frames
        timeout-minutes: 6
        env:
          LIGHTNING_TITLE_CAPTURE: /tmp/lightning-title/title
        run: |
          mkdir -p /tmp/lightning-title
          python3 tests/emulator/run.py
          python3 tests/emulator/ppm_to_png.py /tmp/lightning-title/*.ppm
          test "$(find /tmp/lightning-title -name '*.png' | wc -l)" -eq 7
      - name: Upload only frame images, never ROM, ELF or save data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-yellow-real-mgba-title-frames
          path: /tmp/lightning-title/*.png
          retention-days: 7
          if-no-files-found: error
